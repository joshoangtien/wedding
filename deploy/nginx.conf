# =========================================================
#  NGINX — trỏ tên miền vào thiệp cưới (pm2 chạy ở cổng 5700)
#  1. Đổi "wedding.xenmeta.com" thành tên miền của bạn
#  2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/thiep-cuoi
#     sudo ln -s /etc/nginx/sites-available/thiep-cuoi /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#  3. Bật HTTPS miễn phí:  sudo certbot --nginx -d wedding.xenmeta.com
# =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name wedding.xenmeta.com;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        proxy_pass         http://127.0.0.1:5700;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
